<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - ياسمين الشام</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101522;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 85%;
  max-width: 400px;
  background: #1b2535;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}
h1 { color: #e8c477; }
input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 10px;
  font-size: 16px;
}
input {
  background: #101522;
  border: 1px solid #536078;
  color: white;
}
button {
  background: #218b50;
  color: white;
  border: none;
  font-weight: bold;
}
a { color: #e8c477; }
</style>
</head>
<body>
<div class="container">
<h1>🌹 ياسمين الشام</h1>
<h3>إنشاء حساب جديد</h3>

<form>
<input type="text" placeholder="الاسم الكامل" required>
<input type="tel" placeholder="رقم الهاتف" required>
<input type="email" placeholder="البريد الإلكتروني">
<input type="password" placeholder="كلمة المرور" required>
<button type="submit">إنشاء حساب</button>
</form>

<p>لديك حساب بالفعل؟</p>
<a href="login.html">تسجيل الدخول</a>
</div>
</body>
</html>
