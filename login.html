<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  background: linear-gradient(160deg,#210b3d,#6732a0);

}

}

<button>دخول</button>

<p>أو سجل الدخول باستخدام</p>
<button>Google</button>
