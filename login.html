
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - ياسمين الشام</title>

<style>
body {
  background: linear-gradient(160deg,#210b3d,#6732a0);
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 30px 15px;
}
h1 { color: #f4d47b; }

input, select {
  display: block;
  width: 85%;
  padding: 14px;
  margin: 15px auto;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  background: #e8c46d;
  border: 0;
  border-radius: 25px;
  padding: 14px 30px;
  margin: 10px;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

a { color: #e8c477; }
#message { color: #f4d47b; }
</style>
</head>

<body>

<h1>🌹 ياسمين الشام</h1>
<h2>تسجيل الدخول</h2>

<p>مرحباً بك في عائلتنا ❤️</p>

<select id="country">
<option value="+963">سوريا +963</option>
<option value="+49">ألمانيا +49</option>
<option value="+966">السعودية +966</option>
<option value="+971">الإمارات +971</option>
<option value="+90">تركيا +90</option>
<option value="+962">الأردن +962</option>
<option value="+961">لبنان +961</option>
<option value="+20">مصر +20</option>
</select>

<input type="tel" id="phone" placeholder="رقم الهاتف" disabled>
<input type="password" id="password" placeholder="كلمة المرور" disabled>

<p>تسجيل الدخول برقم الهاتف قيد التجهيز.</p>

<button id="loginButton" disabled>دخول الهاتف (قريباً)</button>

<p>أو سجل الدخول باستخدام</p>

<button id="googleLogin">تسجيل الدخول باستخدام Google</button>

<button id="facebookLogin">Facebook (قريباً)</button>

<p id="message"></p>

<p>ليس لديك حساب؟
<a href="register.html">إنشاء حساب جديد</a>
</p>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCVhMGslHnQ81vwiHuTmmSukxsLJ_gQfhI",
  authDomain: "yasmin-al-sham.firebaseapp.com",
  projectId: "yasmin-al-sham",
  storageBucket: "yasmin-al-sham.firebasestorage.app",
  messagingSenderId: "10030991532",
  appId: "1:10030991532:web:0295b05dc1d11de4fcb709"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const message = document.getElementById("message");
const googleButton = document.getElementById("googleLogin");

googleButton.addEventListener("click", async () => {
  try {
    googleButton.disabled = true;
    message.textContent = "جارٍ تحويلك إلى Google...";
    await signInWithRedirect(auth, provider);
  } catch (error) {
    googleButton.disabled = false;
    message.textContent = "تعذر تسجيل الدخول: " + error.message;
  }
});

try {
  const result = await getRedirectResult(auth);

  if (result?.user) {
    window.location.replace("home.html");
  }
} catch (error) {
  message.textContent = "خطأ في تسجيل الدخول: " + error.message;
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    window.location.replace("home.html");
  }
});

document.getElementById("facebookLogin").addEventListener("click", () => {
  message.textContent = "تسجيل Facebook سيكون متاحاً لاحقاً.";
});
</script>

</body>
</html>
